<section class="account-management">
  <!-- Header -->
  <div class="account-header">
    <h1>Account Management</h1>
    <p>Create accounts, make deposits and withdrawals</p>
  </div>

  <!-- Tabs wrapper com fundo -->
  <div class="tabs-wrapper">
    <div class="tabs">
      <button
        type="button"
        [ngClass]="{ active: selectedTab === 'create' }"
        (click)="selectTab('create')"
      >
        <!-- Ícone Create Account (+) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="none"
          stroke="#555"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>Create Account</span>
      </button>

      <button
        type="button"
        [ngClass]="{ active: selectedTab === 'deposit' }"
        (click)="selectTab('deposit')"
      >
        <!-- Ícone Deposit (seta para cima) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="none"
          stroke="#555"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 19V6M5 12l7-7 7 7" />
        </svg>
        <span>Deposit</span>
      </button>

      <button
        type="button"
        [ngClass]="{ active: selectedTab === 'withdraw' }"
        (click)="selectTab('withdraw')"
      >
        <!-- Ícone Withdraw (seta para baixo) -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="none"
          stroke="#555"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
        <span>Withdraw</span>
      </button>
    </div>
  </div>

  <!-- Input -->
  <div class="form-section">
    <app-input-primary
      label="Amount"
      name="AmountNumber"
      type="number"
    ></app-input-primary>
  </div>

  <!-- Submit Button -->
  <div class="submit-section">
    <button class="action-button" type="button" (click)="onSubmit()">
      {{ getActionButtonText() }}
    </button>
  </div>
</section>
